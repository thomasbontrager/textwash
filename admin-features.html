<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Feature Flags - Admin - TextWash</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Favicon -->
  <link rel="icon" href="assets/favicon.ico" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f7;
      min-height: 100vh;
      padding: 20px;
    }
    
    .header {
      background: white;
      padding: 1.5rem 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .header h1 {
      color: #667eea;
      font-size: 1.75rem;
      font-weight: 700;
    }
    
    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: #667eea;
      color: white;
    }
    
    .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    
    .btn-secondary {
      background: #e2e8f0;
      color: #334155;
    }
    
    .btn-secondary:hover {
      background: #cbd5e1;
    }
    
    .btn-danger {
      background: #ef4444;
      color: white;
    }
    
    .btn-danger:hover {
      background: #dc2626;
    }
    
    .btn-small {
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .flags-grid {
      display: grid;
      gap: 1.5rem;
    }
    
    .flag-card {
      background: white;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: box-shadow 0.2s;
    }
    
    .flag-card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }
    
    .flag-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }
    
    .flag-name {
      font-size: 1.25rem;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 0.25rem;
    }
    
    .flag-description {
      color: #64748b;
      font-size: 0.95rem;
    }
    
    .flag-status {
      display: inline-block;
      padding: 0.375rem 0.875rem;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 600;
    }
    
    .status-enabled {
      background: #d1fae5;
      color: #065f46;
    }
    
    .status-disabled {
      background: #fee2e2;
      color: #991b1b;
    }
    
    .flag-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #e2e8f0;
    }
    
    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    
    .detail-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
    }
    
    .detail-value {
      font-size: 0.95rem;
      color: #1e293b;
      font-weight: 500;
    }
    
    .plan-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    
    .plan-badge {
      padding: 0.25rem 0.75rem;
      background: #667eea;
      color: white;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    
    .flag-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #e2e8f0;
    }
    
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      padding: 20px;
      overflow-y: auto;
    }
    
    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .modal-content {
      background: white;
      padding: 2rem;
      border-radius: 16px;
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    
    .modal-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1e293b;
    }
    
    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #64748b;
    }
    
    .form-group {
      margin-bottom: 1.5rem;
    }
    
    .form-label {
      display: block;
      font-weight: 600;
      color: #334155;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }
    
    .form-input,
    .form-textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    
    .form-input:focus,
    .form-textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .form-textarea {
      resize: vertical;
      min-height: 80px;
    }
    
    .form-checkbox {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    
    .form-checkbox input {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }
    
    .form-slider {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    
    .slider {
      flex: 1;
      height: 8px;
      border-radius: 4px;
      background: #e2e8f0;
      outline: none;
      -webkit-appearance: none;
    }
    
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #667eea;
      cursor: pointer;
    }
    
    .slider::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #667eea;
      cursor: pointer;
      border: none;
    }
    
    .slider-value {
      font-weight: 600;
      color: #667eea;
      min-width: 50px;
    }
    
    .checkbox-group {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }
    
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem;
      background: #f8fafc;
      border-radius: 6px;
    }
    
    .user-overrides {
      margin-top: 0.5rem;
    }
    
    .user-override-item {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    
    .user-override-item input {
      flex: 1;
    }
    
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: #64748b;
    }
    
    .empty-state h2 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #334155;
    }
    
    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    
    .success {
      background: #d1fae5;
      color: #065f46;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🚀 Feature Flags</h1>
      <button class="btn btn-primary" onclick="openCreateModal()">+ Create Flag</button>
    </div>
    
    <div id="message"></div>
    
    <div id="flagsList" class="flags-grid">
      <div class="empty-state">
        <h2>Loading...</h2>
        <p>Fetching feature flags</p>
      </div>
    </div>
  </div>

  <!-- Create/Edit Modal -->
  <div id="flagModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Create Feature Flag</h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      
      <form id="flagForm" onsubmit="saveFlag(event)">
        <input type="hidden" id="flagId" />
        
        <div class="form-group">
          <label class="form-label" for="flagName">Flag Key *</label>
          <input type="text" id="flagName" class="form-input" required 
                 placeholder="e.g., advanced_analytics" />
        </div>
        
        <div class="form-group">
          <label class="form-label" for="flagDescription">Description</label>
          <textarea id="flagDescription" class="form-textarea" 
                    placeholder="What does this feature flag control?"></textarea>
        </div>
        
        <div class="form-group">
          <div class="form-checkbox">
            <input type="checkbox" id="flagEnabled" />
            <label class="form-label" for="flagEnabled" style="margin: 0;">
              Enable this feature flag
            </label>
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label" for="rolloutPercentage">
            Rollout Percentage: <span id="rolloutValue">0</span>%
          </label>
          <div class="form-slider">
            <input type="range" id="rolloutPercentage" class="slider" 
                   min="0" max="100" value="0" 
                   oninput="updateRolloutValue(this.value)" />
          </div>
          <small style="color: #64748b; font-size: 0.875rem;">
            Gradually roll out to a percentage of users (0-100%)
          </small>
        </div>
        
        <div class="form-group">
          <label class="form-label">Plan Access</label>
          <div class="checkbox-group">
            <div class="checkbox-item">
              <input type="checkbox" id="plan-FREE" value="FREE" />
              <label for="plan-FREE">Free</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="plan-STARTER" value="STARTER" />
              <label for="plan-STARTER">Starter</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="plan-PRO" value="PRO" />
              <label for="plan-PRO">Pro</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="plan-ENTERPRISE" value="ENTERPRISE" />
              <label for="plan-ENTERPRISE">Enterprise</label>
            </div>
          </div>
          <small style="color: #64748b; font-size: 0.875rem;">
            Select which plans have access (empty = all plans)
          </small>
        </div>
        
        <div class="form-group">
          <label class="form-label">User Overrides</label>
          <div id="userOverridesList" class="user-overrides"></div>
          <button type="button" class="btn btn-secondary btn-small" 
                  onclick="addUserOverride()">+ Add User Override</button>
          <small style="color: #64748b; font-size: 0.875rem; display: block; margin-top: 0.5rem;">
            Override flag for specific user IDs
          </small>
        </div>
        
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
          <button type="submit" class="btn btn-primary" style="flex: 1;">
            Save
          </button>
          <button type="button" class="btn btn-secondary" onclick="closeModal()">
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000/api/admin';
    let authToken = null;
    let currentFlags = [];

    // Check authentication
    function checkAuth() {
      authToken = localStorage.getItem('authToken');
      if (!authToken) {
        window.location.href = '/index.html';
        return false;
      }
      return true;
    }

    // Show message
    function showMessage(message, type = 'success') {
      const msgDiv = document.getElementById('message');
      msgDiv.className = type;
      msgDiv.textContent = message;
      msgDiv.style.display = 'block';
      
      setTimeout(() => {
        msgDiv.style.display = 'none';
      }, 5000);
    }

    // Fetch all feature flags
    async function fetchFlags() {
      try {
        const response = await fetch(`${API_BASE}/feature-flags`, {
          headers: {
            'Authorization': `Bearer ${authToken}`
          }
        });
        
        if (!response.ok) {
          throw new Error('Failed to fetch flags');
        }
        
        currentFlags = await response.json();
        renderFlags();
      } catch (error) {
        console.error('Error fetching flags:', error);
        document.getElementById('flagsList').innerHTML = `
          <div class="empty-state">
            <h2>Error</h2>
            <p>Failed to load feature flags</p>
          </div>
        `;
      }
    }

    // Render flags list
    function renderFlags() {
      const container = document.getElementById('flagsList');
      
      if (currentFlags.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h2>No Feature Flags</h2>
            <p>Create your first feature flag to get started</p>
          </div>
        `;
        return;
      }
      
      container.innerHTML = currentFlags.map(flag => {
        const planAccess = flag.planAccess || [];
        const userOverrides = flag.userOverrides || {};
        const overrideCount = Object.keys(userOverrides).length;
        
        return `
          <div class="flag-card">
            <div class="flag-header">
              <div>
                <div class="flag-name">${flag.name}</div>
                ${flag.description ? `<div class="flag-description">${flag.description}</div>` : ''}
              </div>
              <span class="flag-status ${flag.isEnabled ? 'status-enabled' : 'status-disabled'}">
                ${flag.isEnabled ? 'Enabled' : 'Disabled'}
              </span>
            </div>
            
            <div class="flag-details">
              <div class="detail-item">
                <span class="detail-label">Rollout</span>
                <span class="detail-value">${flag.rolloutPercentage}%</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Plans</span>
                <div class="plan-badges">
                  ${planAccess.length > 0 
                    ? planAccess.map(plan => `<span class="plan-badge">${plan}</span>`).join('') 
                    : '<span class="detail-value">All Plans</span>'}
                </div>
              </div>
              <div class="detail-item">
                <span class="detail-label">User Overrides</span>
                <span class="detail-value">${overrideCount} users</span>
              </div>
            </div>
            
            <div class="flag-actions">
              <button class="btn btn-secondary btn-small" onclick='editFlag(${JSON.stringify(flag)})'>
                Edit
              </button>
              <button class="btn btn-danger btn-small" onclick="deleteFlag('${flag.id}', '${flag.name}')">
                Delete
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Open create modal
    function openCreateModal() {
      document.getElementById('modalTitle').textContent = 'Create Feature Flag';
      document.getElementById('flagForm').reset();
      document.getElementById('flagId').value = '';
      document.getElementById('userOverridesList').innerHTML = '';
      updateRolloutValue(0);
      document.getElementById('flagModal').classList.add('active');
    }

    // Edit flag
    function editFlag(flag) {
      document.getElementById('modalTitle').textContent = 'Edit Feature Flag';
      document.getElementById('flagId').value = flag.id;
      document.getElementById('flagName').value = flag.name;
      document.getElementById('flagDescription').value = flag.description || '';
      document.getElementById('flagEnabled').checked = flag.isEnabled;
      document.getElementById('rolloutPercentage').value = flag.rolloutPercentage;
      updateRolloutValue(flag.rolloutPercentage);
      
      // Set plan checkboxes
      const plans = ['FREE', 'STARTER', 'PRO', 'ENTERPRISE'];
      plans.forEach(plan => {
        const checkbox = document.getElementById(`plan-${plan}`);
        checkbox.checked = (flag.planAccess || []).includes(plan);
      });
      
      // Set user overrides
      const overridesList = document.getElementById('userOverridesList');
      overridesList.innerHTML = '';
      const overrides = flag.userOverrides || {};
      Object.entries(overrides).forEach(([userId, enabled]) => {
        addUserOverride(userId, enabled);
      });
      
      document.getElementById('flagModal').classList.add('active');
    }

    // Close modal
    function closeModal() {
      document.getElementById('flagModal').classList.remove('active');
    }

    // Update rollout value display
    function updateRolloutValue(value) {
      document.getElementById('rolloutValue').textContent = value;
    }

    // Add user override input
    function addUserOverride(userId = '', enabled = true) {
      const container = document.getElementById('userOverridesList');
      const id = Date.now();
      const div = document.createElement('div');
      div.className = 'user-override-item';
      div.id = `override-${id}`;
      div.innerHTML = `
        <input type="text" class="form-input" placeholder="User ID" 
               value="${userId}" data-override-user />
        <select class="form-input" style="max-width: 120px;" data-override-enabled>
          <option value="true" ${enabled ? 'selected' : ''}>Enabled</option>
          <option value="false" ${!enabled ? 'selected' : ''}>Disabled</option>
        </select>
        <button type="button" class="btn btn-danger btn-small" 
                onclick="removeUserOverride('${id}')">×</button>
      `;
      container.appendChild(div);
    }

    // Remove user override
    function removeUserOverride(id) {
      const element = document.getElementById(`override-${id}`);
      if (element) element.remove();
    }

    // Save flag
    async function saveFlag(event) {
      event.preventDefault();
      
      const flagId = document.getElementById('flagId').value;
      const name = document.getElementById('flagName').value;
      const description = document.getElementById('flagDescription').value;
      const isEnabled = document.getElementById('flagEnabled').checked;
      const rolloutPercentage = parseInt(document.getElementById('rolloutPercentage').value);
      
      // Get selected plans
      const plans = ['FREE', 'STARTER', 'PRO', 'ENTERPRISE'];
      const selectedPlans = plans.filter(plan => 
        document.getElementById(`plan-${plan}`).checked
      );
      
      // Get user overrides
      const userOverrides = {};
      const overrideItems = document.querySelectorAll('.user-override-item');
      overrideItems.forEach(item => {
        const userId = item.querySelector('[data-override-user]').value.trim();
        const enabled = item.querySelector('[data-override-enabled]').value === 'true';
        if (userId) {
          userOverrides[userId] = enabled;
        }
      });
      
      const data = {
        name,
        description,
        isEnabled,
        rolloutPercentage,
        planAccess: selectedPlans.length > 0 ? selectedPlans : null,
        userOverrides: Object.keys(userOverrides).length > 0 ? userOverrides : null
      };
      
      try {
        const url = flagId 
          ? `${API_BASE}/feature-flags/${flagId}` 
          : `${API_BASE}/feature-flags`;
        const method = flagId ? 'PUT' : 'POST';
        
        const response = await fetch(url, {
          method,
          headers: {
            'Authorization': `Bearer ${authToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        });
        
        if (!response.ok) {
          throw new Error('Failed to save flag');
        }
        
        showMessage(flagId ? 'Flag updated successfully' : 'Flag created successfully');
        closeModal();
        fetchFlags();
      } catch (error) {
        console.error('Error saving flag:', error);
        showMessage('Failed to save flag', 'error');
      }
    }

    // Delete flag
    async function deleteFlag(id, name) {
      if (!confirm(`Are you sure you want to delete the feature flag "${name}"?`)) {
        return;
      }
      
      try {
        const response = await fetch(`${API_BASE}/feature-flags/${id}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${authToken}`
          }
        });
        
        if (!response.ok) {
          throw new Error('Failed to delete flag');
        }
        
        showMessage('Flag deleted successfully');
        fetchFlags();
      } catch (error) {
        console.error('Error deleting flag:', error);
        showMessage('Failed to delete flag', 'error');
      }
    }

    // Initialize
    if (checkAuth()) {
      fetchFlags();
    }
  </script>
</body>
</html>
